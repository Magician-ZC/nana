<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Nana - 你的贴心AI伙伴</title>
    <!-- Live2D 核心库 -->
    <script src="/libs/live2dcubismcore.min.js"></script>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Preline UI CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.css" />
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- 配置 TailwindCSS 主题 -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              },
              neutral: {
                50: '#fafafa',
                100: '#f5f5f5',
                200: '#e5e5e5',
                300: '#d4d4d4',
                400: '#a3a3a3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#171717',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'slide-up': 'slideUp 0.4s ease-out forwards',
              'scale-in': 'scaleIn 0.3s ease-out forwards',
              'pulse-soft': 'pulseSoft 2s infinite',
              'spin-slow': 'spin 3s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.7' },
              },
            },
            transitionTimingFunction: {
              'bounce-soft': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
          }
        },
        plugins: [
          // 添加响应式设计支持
          function({ addUtilities }) {
            const newUtilities = {
              '.safe-top': {
                paddingTop: 'env(safe-area-inset-top)',
              },
              '.safe-bottom': {
                paddingBottom: 'env(safe-area-inset-bottom)',
              },
              '.safe-left': {
                paddingLeft: 'env(safe-area-inset-left)',
              },
              '.safe-right': {
                paddingRight: 'env(safe-area-inset-right)',
              },
              '.touch-callout-none': {
                WebkitTouchCallout: 'none',
              },
            }
            addUtilities(newUtilities)
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Preline UI JS -->
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <!-- Recorder.js 录音库 -->
    <script src="https://cdn.jsdelivr.net/gh/xiangyuecn/Recorder@1.3.24102001/src/recorder-core.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/xiangyuecn/Recorder@1.3.24102001/src/engine/mp3.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/xiangyuecn/Recorder@1.3.24102001/src/engine/mp3-engine.js"></script>
  </body>
</html>
